
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskbot
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: taskbot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskbot -d taskbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://taskbot:ci_test_password@127.0.0.1:5433/taskbot_test
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: ci_test_password
      POSTGRES_DB: taskbot_test
      REDIS_HOST: localhost
      REDIS_PORT: "6380"
      DEBUG: "false"

      # Non-production placeholders required by application config.
      TELEGRAM_BOT_TOKEN: "123456:CIPlaceholderToken"
      OPENAI_API_KEY: "ci-placeholder-key"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: taskbot
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: taskbot
        run: docker compose config --quiet
