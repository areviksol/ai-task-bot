
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: taskbot
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: taskbot_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U taskbot -d taskbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      POSTGRES_USER: taskbot
      POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
      POSTGRES_DB: taskbot_test
      DEBUG: "false"
      TELEGRAM_BOT_TOKEN: "123456:TestOnlyToken"
      OPENAI_API_KEY: "test-only-key"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest httpx

      - name: Configure test database
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        shell: bash
        run: |
          echo "::add-mask::$CI_DB_PASSWORD"
          echo "TEST_DATABASE_URL=postgresql+psycopg://taskbot:${CI_DB_PASSWORD}@127.0.0.1:5433/taskbot_test" >> "$GITHUB_ENV"

      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose-validation:
    name: Docker Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Create temporary environment
        shell: bash
        env:
          CI_DB_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
        run: |
          cp .env.example .env

          {
            echo "POSTGRES_USER=taskbot"
            echo "POSTGRES_PASSWORD=$CI_DB_PASSWORD"
            echo "POSTGRES_DB=taskbot"
          } >> .env

          chmod 600 .env

      - name: Validate Docker Compose
        env:
          POSTGRES_USER: taskbot
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: taskbot
        run: docker compose config --quiet
